<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-label="The branch-status panel: develop with 3 merges to release listed under it, and feat/login with its 2 commits listed under it">
  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 14px; }
    .main { fill: #a6da95; } .dev { fill: #eed49f; } .you { fill: #8aadf4; }
    .warn { fill: #ed8796; } .dim { fill: #8087a2; } .txt { fill: #cad3f5; }
  </style>
  <rect width="600" height="360" rx="12" fill="#24273a"/>
  <rect width="600" height="34" rx="12" fill="#1e2030"/>
  <rect y="22" width="600" height="12" fill="#1e2030"/>
  <circle cx="22" cy="17" r="6" fill="#ed8796"/>
  <circle cx="42" cy="17" r="6" fill="#eed49f"/>
  <circle cx="62" cy="17" r="6" fill="#a6da95"/>
  <text x="300" y="22" text-anchor="middle" class="dim">Git</text>

  <g stroke-width="2" fill="none">
    <path d="M34 66 V102 H54" stroke="#eed49f"/>
    <path d="M60 106 V230 H78" stroke="#8aadf4"/>
  </g>
  <circle cx="34" cy="62" r="6" fill="#a6da95"/>
  <circle cx="60" cy="102" r="6" fill="#eed49f"/>
  <circle cx="84" cy="230" r="6" fill="#8aadf4"/>

  <text x="50" y="67" class="main">main</text>
  <text x="76" y="107" class="dev">develop</text>
  <text x="76" y="133" class="dev">3 to release</text>
  <circle cx="79" cy="152" r="2" fill="#8087a2"/>
  <text x="90" y="157" class="txt">#88  feat/search-autocomplete</text>
  <circle cx="79" cy="176" r="2" fill="#8087a2"/>
  <text x="90" y="181" class="txt">#87  fix/login-redirect</text>
  <circle cx="79" cy="200" r="2" fill="#8087a2"/>
  <text x="90" y="205" class="txt">#85  chore/bump-deps</text>

  <text x="100" y="235" class="you" font-weight="bold">feat/login</text>
  <text x="208" y="235" class="txt" font-weight="bold">← you</text>
  <text x="100" y="261" class="dim">2 commits</text>
  <circle cx="103" cy="280" r="2" fill="#8087a2"/>
  <text x="114" y="285" class="txt">feat(auth): remember me on login</text>
  <circle cx="103" cy="304" r="2" fill="#8087a2"/>
  <text x="114" y="309" class="txt">test(auth): cover the remember-me cookie</text>
  <text x="100" y="335" class="warn">develop has 4 new, pull it</text>
</svg>
